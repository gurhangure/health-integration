name: Mobile CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  quality:
    name: Format, analyze, and deterministic tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test test/unit
      - name: Component and data-boundary integration tests
        run: flutter test test/integration
      - name: Widget tests
        run: flutter test test/widget

  android:
    name: Android debug build and emulator E2E
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v5
      - run: flutter pub get --enforce-lockfile
      - name: Build production entry point
        run: flutter build apk --debug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device E2E with synthetic health source
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: flutter test integration_test/health_app_test.dart -d emulator-5554

  ios:
    name: iOS simulator build and E2E
    needs: quality
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build production entry point without signing
        run: flutter build ios --simulator --debug --no-codesign
      - name: Select and boot an available iPhone simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          device_id=$(python3 - "$RUNNER_TEMP/simulators.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1]) as source:
              devices = json.load(source)['devices']
          iphones = [device for runtime in sorted(devices, reverse=True)
                     if 'iOS' in runtime for device in devices[runtime]
                     if device['name'].startswith('iPhone') and device['isAvailable']]
          if not iphones:
              raise SystemExit('No available iPhone simulator on this runner.')
          print(iphones[0]['udid'])
          PY
          )
          xcrun simctl bootstatus "$device_id" -b
          echo "IOS_DEVICE_ID=$device_id" >> "$GITHUB_ENV"
      - name: Device E2E with synthetic health source and normal iOS launch
        run: flutter test integration_test/health_app_test.dart -d "$IOS_DEVICE_ID"
