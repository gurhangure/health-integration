name: Mobile CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  quality:
    name: Format, analyze, and deterministic tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test test/unit
      - name: Component and data-boundary integration tests
        run: flutter test test/integration
      - name: Widget tests
        run: flutter test test/widget

  android:
    name: Android debug build and emulator E2E
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v5
      - run: flutter pub get --enforce-lockfile
      - name: Build production entry point
        run: flutter build apk --debug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device E2E with synthetic health source
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: flutter test integration_test/health_app_test.dart -d emulator-5554

  ios:
    name: iOS simulator build and E2E
    needs: quality
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # device_info_plus 13.3.0 requires Xcode >= 26.1.1; avoid the runner default.
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - name: Verify selected Xcode and simulator SDK
        run: |
          mkdir -p "$RUNNER_TEMP/ios-e2e"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build production entry point without signing
        run: flutter build ios --simulator --debug --no-codesign
      - name: Select and boot an available iPhone simulator
        timeout-minutes: 5
        shell: bash
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/ios-e2e/simulators.json"
          sdk_version=$(xcrun --sdk iphonesimulator --show-sdk-version)
          device_id=$(python3 - "$RUNNER_TEMP/ios-e2e/simulators.json" "$sdk_version" <<'PY'
          import json
          import sys
          with open(sys.argv[1]) as source:
              devices = json.load(source)['devices']
          runtime = 'com.apple.CoreSimulator.SimRuntime.iOS-' + '-'.join(sys.argv[2].split('.')[:2])
          iphones = [device for device in devices.get(runtime, [])
                     if device['name'].startswith('iPhone') and device['isAvailable']]
          if not iphones:
              raise SystemExit(f'No available iPhone simulator matching SDK {sys.argv[2]}.')
          print(f"Selected {iphones[0]['name']} on {runtime}: {iphones[0]['udid']}", file=sys.stderr)
          print(iphones[0]['udid'])
          PY
          )
          echo "IOS_DEVICE_ID=$device_id" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$device_id" -b 2>&1 | tee "$RUNNER_TEMP/ios-e2e/boot.log"
          flutter devices --machine > "$RUNNER_TEMP/ios-e2e/flutter-devices.json"
      - name: Device E2E with synthetic health source and normal iOS launch
        timeout-minutes: 12
        shell: bash
        run: |
          set -o pipefail
          flutter test integration_test/health_app_test.dart -d "$IOS_DEVICE_ID" \
            --no-pub --verbose --reporter expanded \
            2>&1 | tee "$RUNNER_TEMP/ios-e2e/flutter-test.log"
      - name: Capture iOS failure diagnostics
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/ios-e2e"
          xcrun simctl list devices --json > "$RUNNER_TEMP/ios-e2e/simulators-final.json" 2>&1 || true
          if [ -n "${IOS_DEVICE_ID:-}" ]; then
            xcrun simctl io "$IOS_DEVICE_ID" screenshot "$RUNNER_TEMP/ios-e2e/simulator.png" || true
            xcrun simctl spawn "$IOS_DEVICE_ID" launchctl list > "$RUNNER_TEMP/ios-e2e/processes.txt" 2>&1 || true
            xcrun simctl spawn "$IOS_DEVICE_ID" log show --last 15m --style compact \
              --predicate 'process == "Runner"' > "$RUNNER_TEMP/ios-e2e/runner.log" 2>&1 || true
          fi
      - name: Upload iOS launch and test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-e2e-diagnostics
          path: ${{ runner.temp }}/ios-e2e
          retention-days: 7
